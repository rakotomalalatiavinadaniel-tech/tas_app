*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--cr);color:var(--ink)}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:.2em 0}
header{background:var(--g);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--am)}
header small{display:block;font-size:12px;opacity:.85;line-height:1.1}
.lg button{border:2px solid transparent;background:#ffffff22;border-radius:8px;font-size:22px;padding:2px 6px;margin-left:6px}.lg .on{border-color:var(--am);background:#ffffff44}
main{max-width:760px;margin:0 auto;padding:10px 12px 40px}
.c{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.btn{display:block;width:100%;background:var(--g2);color:#fff;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:700}
.b2{background:#fff;color:var(--g);border:2px solid var(--g2)}.bd{background:var(--rd)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:16px;background:#fff}
label{font-size:13px;font-weight:600;color:#44564a;display:block;margin-top:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--cr);border-radius:8px;padding:8px;font-size:13px}.k b{display:block;font-size:17px}
.v{padding:14px;border-radius:10px;color:#fff;font-weight:700;text-align:center;font-size:18px}
.ok{background:var(--g2)}.ko{background:var(--rd)}.nl{background:var(--am);color:#2b2300}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--bd);padding:5px 3px;text-align:right}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:11px;border:0;border-radius:10px;background:#dbe4d4;font-weight:700;font-size:14px}.tabs .on{background:var(--g);color:#fff}
.hero{background:var(--g);color:#fff;border-radius:12px;padding:16px;border-left:8px solid var(--am)}
td input{padding:4px;font-size:13px;min-width:110px}

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=x=>isFinite(x)?(+x).toLocaleString('fr-FR',{maximumFractionDigits:3}):'—',m=x=>f(x)+' '+esc(S.cur);
const dt=d=>d?d.split('-').reverse().join('/'):'—',today=()=>new Date().toISOString().slice(0,10);
const st=p=>p>0.0005?['ok',tr('profit')]:p<-0.0005?['ko',tr('loss')]:['nl',tr('nul')];
let DP;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;if(V.lot==null)render()});addEventListener('appinstalled',()=>{DP=null;render()});
function inst(){DP.prompt();DP.userChoice.finally(()=>{DP=null;render()})}
function setLang(x){S.lang=x;save();render();if($('#ov').classList.contains('on'))$('#pn').innerHTML=drawer()}
function calc(l){const D=[...l.days].sort((a,b)=>a.d<b.d?-1:1),pk=+l.pk||0;let mort=0,al=0,ac=0,au=0,w=+l.p0||0;const ser=[],rows=[];
D.forEach(e=>{mort+=+e.mort||0;if(+e.poids>0)w=+e.poids;const a=+e.alim||0;al+=a;ac+=a*(+e.pa||0);au+=+e.autres||0;const v=l.n0-mort,tw=v*w,cc=l.n0*l.cu+ac+au,rev=tw*pk;
ser.push({p:rev-cc});rows.push({...e,v,w,tw,dc:a*(+e.pa||0)+(+e.autres||0),cc,rev,pr:rev-cc,seuil:v>0?cc/v:NaN,seuilKg:tw>0?cc/tw:NaN})});
const v=l.n0-mort,tw=v*w,cost=l.n0*l.cu+ac+au,rev=tw*pk,gain=tw-l.n0*(l.p0||0);
return{D,rows,ser,mort,v,w,tw,al,ac,au,cost,rev,pr:rev-cost,seuil:v>0?cost/v:NaN,seuilKg:tw>0?cost/tw:NaN,mp:l.n0?mort/l.n0*100:0,ic:gain>0?al/gain:NaN,last:D[D.length-1]||{}}}
function go(l,t){V.lot=l;V.tab=t||'s';V.ed=null;V.el=null;render();scrollTo(0,0)}
function render(){document.documentElement.lang=S.lang==='mg'?'mg':'fr';
$('#hd').innerHTML=`<div style="display:flex;align-items:center;gap:10px"><button class=bg onclick="dr(1)" aria-label="Menu">☰</button><div><b style="font:700 22px Georgia,serif"><img src="${LG}" class=lgo>T.A.S</b><small>Trafo AgroSystème · ${tr('off')}</small></div></div><div class=lg><button class="${S.lang=='mg'?'on':''}" onclick="setLang('mg')" aria-label="Malagasy">🇲🇬</button><button class="${S.lang=='fr'?'on':''}" onclick="setLang('fr')" aria-label="Français">🇫🇷</button></div>`;
$('#app').innerHTML=V.lot==null?home():V.lot==='new'?form():lotv(L())}
function home(){return`<section class=hero2><div class=hi></div><div class=hb><h2 style="font-size:19px">${tr('tag')}</h2><div style="font-size:13px;opacity:.9">${tr('sub')}</div><div class=chips>${Object.keys(ES).map(k=>`<span>${ES[k]} ${sp(k)}</span>`).join('')}</div></div></section>
${DP?`<button class=btn style="margin-top:10px;background:var(--am);color:#2b2300" onclick="inst()">${tr('inst')}</button>`:matchMedia('(display-mode: standalone)').matches?'':`<div class=c style="font-size:13px">${tr('tip')}</div>`}
<button class=btn style="margin-top:10px" onclick="go('new')">${tr('newLot')}</button>
${S.lots.map(l=>{const c=calc(l),s=st(c.pr);return`<div class=c onclick="go(${l.id},'b')"><b>${ES[l.esp]} ${esc(l.name)}</b><div style="font-size:13px">${c.v}/${l.n0} ${tr('viv2')} · ${c.D.length} ${tr('suiv')}</div><div class="v ${s[0]}" style="margin-top:6px;font-size:15px">${c.D.length?m(c.pr):tr('noF')}</div></div>`}).join('')||`<div class=c>${tr('none')}</div>`}
`}
const inp=(i,t,lb,v='')=>`<label>${lb}</label><input id=${i} type=${t} value="${v}" ${t=='number'?'inputmode=decimal step=any':''}>`;
function form(){const e=V.el&&S.lots.find(x=>x.id==V.el)||{};return`<button class="btn b2" onclick="go(${e.id||'null'},'s')">${tr('back')}</button><div class=c><h3>${e.id?tr('editL'):tr('newLot').replace('+ ','')}</h3>${inp('nm','text',tr('nm'),esc(e.name||''))}<label>${tr('esp')}</label><select id=es>${Object.keys(ES).map(k=>`<option value=${k}${e.esp==k?' selected':''}>${ES[k]} ${sp(k)}</option>`).join('')}</select>${inp('st','date',tr('st'),e.start||today())}${inp('n0','number',tr('n0'),e.n0||'')}${inp('cu','number',tr('cu'),e.cu||'')}${inp('p0','number',tr('p0'),e.p0||'')}${inp('pk','number',tr('pk'),e.pk||'')}<button class=btn style="margin-top:12px" onclick=addLot()>${e.id?tr('upd2'):tr('create')}</button></div>`}
function addLot(){const g=i=>$('#'+i).value,n0=+g('n0');if(!g('nm')||!n0)return alert(tr('req'));
const o={name:g('nm'),esp:g('es'),start:g('st'),n0,cu:+g('cu')||0,p0:+g('p0')||0,pk:+g('pk')||0};
if(V.el){Object.assign(S.lots.find(x=>x.id==V.el),o);save();go(V.el,'b')}else{S.lots.push({id:Date.now(),...o,days:[]});save();go(S.lots.at(-1).id)}}
function editLot(id){go('new');V.el=id;render();scrollTo(0,0)}
function lotv(l){return`<button class="btn b2 np" onclick="go(null)">${tr('mine')}</button><div style="display:flex;justify-content:space-between;align-items:center" class=np><h2>${ES[l.esp]} ${esc(l.name)}</h2><button class=b2 style="border-radius:8px;padding:8px 10px;font-weight:700" onclick="editLot(${l.id})">⚙️ ${tr('editL')}</button></div>${l.pk?'':`<div class="c np" style="border-color:var(--am)">${tr('needPk')}</div>`}<div class="tabs np"><button class="${V.tab=='s'?'on':''}" onclick="go(${l.id},'s')">${tr('tS')}</button><button class="${V.tab=='j'?'on':''}" onclick="go(${l.id},'j')">${tr('tJ')}</button><button class="${V.tab=='b'?'on':''}" onclick="go(${l.id},'b')">${tr('tB')}</button></div>${V.tab=='s'?saisie(l):V.tab=='j'?jour(l):bil(l)}`}
function saisie(l){const c=calc(l),e=V.ed&&l.days.find(x=>x.d==V.ed)||{},n=v=>v||'';return`<div class=c><div class=g2><div>${inp('d','date',tr('d'),e.d||today())}</div><div>${inp('mo','number',tr('mo'),n(e.mort))}</div><div>${inp('po','number',tr('po'),n(e.poids))}</div><div>${inp('al','number',tr('al'),n(e.alim))}</div><div>${inp('pa','number',tr('pa'),n(e.pa||c.last.pa))}</div><div>${inp('au','number',tr('au'),n(e.autres))}</div></div>${inp('ob','text',tr('ob'),esc(e.obs||''))}<button class=btn style="margin-top:12px" onclick="addDay(${l.id})">${V.ed?tr('upd'):tr('saveD')}</button></div><div class=c>${tbl(c,true,l)}</div><button class="btn bd np" onclick="delLot(${l.id})">${tr('dL')}</button>`}
function addDay(id){const l=S.lots.find(x=>x.id==id),g=i=>$('#'+i).value,d=g('d');if(!d)return alert(tr('reqD'));
l.days=l.days.filter(e=>e.d!=d);l.days.push({d,mort:+g('mo')||0,poids:+g('po')||0,alim:+g('al')||0,pa:+g('pa')||0,autres:+g('au')||0,obs:g('ob')});save();const was=V.ed;V.ed=null;if(was)V.tab='j';render()}
function tbl(c,ed,l){return`<div class=sc><table><tr><th>${tr('d')}</th><th>${tr('hMort')}</th><th>${tr('hViv')}</th><th>${tr('hPoids')}</th><th>${tr('hAl')}</th><th>${tr('hAu')}</th><th>${tr('ob')}</th>${ed?'<th></th>':''}</tr>${c.rows.map(r=>`<tr><td>${dt(r.d)}</td><td>${f(r.mort)}</td><td>${r.v}</td><td>${f(r.poids)}</td><td>${f(r.alim)}</td><td>${f(r.autres)}</td><td style="text-align:left">${ed?`<input value="${esc(r.obs)}" onchange="obs(${l.id},'${r.d}',this.value)">`:esc(r.obs)}</td>${ed?`<td><button onclick="delDay(${l.id},'${r.d}')">✕</button></td>`:''}</tr>`).join('')}</table></div>`}
function obs(id,d,v){S.lots.find(x=>x.id==id).days.find(e=>e.d==d).obs=v;save()}
function delDay(id,d){if(!confirm(tr('cD')))return;const l=S.lots.find(x=>x.id==id);l.days=l.days.filter(e=>e.d!=d);save();render()}
function delLot(id){if(!confirm(tr('cL')))return;S.lots=S.lots.filter(x=>x.id!=id);save();go(null)}
function jour(l){const c=calc(l);
return`<div class="np c"><button class=btn onclick="pe('jrn','Journal')">${tr('jAll')}</button></div><div id=jrn><div class=po0 style="border-bottom:3px solid var(--g);margin-bottom:8px"><b style="color:var(--g);font:700 22px Georgia,serif"><img src="${LG}" class=lgo>T.A.S</b> <small>Trafo AgroSystème</small><h3>${tr('jT')} — ${ES[l.esp]} ${esc(l.name)}</h3></div>${c.rows.length?[...c.rows].reverse().map(r=>card(l,r)).join(''):`<div class=c>${tr('jEmpty')}</div>`}</div>`}
function card(l,r){const s=st(r.pr),age=Math.max(0,Math.round((new Date(r.d)-new Date(l.start))/864e5)),k=(a,b)=>`<div class=k>${a}<b>${b}</b></div>`;
return`<div class="c jc" id="j-${r.d}"><div class=po><b style="color:var(--g);font:700 18px Georgia,serif"><img src="${LG}" class=lgo>T.A.S</b> <small>Trafo AgroSystème · ${ES[l.esp]} ${esc(l.name)}</small></div>
<div style="display:flex;justify-content:space-between"><b>📅 ${dt(r.d)}</b><span>${tr('jr')}${age}</span></div>
<div class="v ${s[0]}" style="margin:8px 0;font-size:15px">${s[1]} : ${m(r.pr)}</div>
<div class=g2>${k(tr('viv'),r.v+' (−'+f(r.mort)+')')}${k(tr('po'),f(r.w))}${k(tr('bio'),f(r.tw)+' kg')}${k(tr('feedD'),f(r.alim)+' kg')}${k(tr('dayC'),m(r.dc))}${k(tr('cumC'),m(r.cc))}${k(tr('rec'),m(r.rev))}${k(tr('minK'),m(r.seuilKg))}</div>
<div style="margin-top:6px;font-size:14px"><b>${tr('sA')} :</b> ${m(r.seuil)}</div>${r.obs?`<div style="font-size:14px;margin-top:4px">📝 ${esc(r.obs)}</div>`:''}
<div class="row np" style="margin-top:8px"><button onclick="editDay(${l.id},'${r.d}')">${tr('jEdit')}</button><button onclick="pe('j-${r.d}','Journal','${r.d}')">${tr('jPrint')}</button><button onclick="delDay(${l.id},'${r.d}')">${tr('jDel')}</button></div></div>`}
function pe(id,tag,d){document.querySelectorAll('#pz').forEach(x=>x.remove());const z=document.createElement('div');z.id='pz';z.appendChild($('#'+id).cloneNode(true));document.body.appendChild(z);document.body.dataset.pm=id=='jrn'?'all':'one';const t=document.title,l=L();document.title='TAS_'+tag+'_'+(l?l.name:'').replace(/\W+/g,'_')+(d?'_'+d:'');addEventListener('afterprint',()=>{z.remove();document.title=t},{once:true});print()}
function editDay(id,d){go(id,'s');V.ed=d;render();scrollTo(0,0)}
function chart(s){if(s.length<2)return'';const W=300,H=80,v=s.map(x=>x.p),mn=Math.min(0,...v),mx=Math.max(0,...v),r=mx-mn||1,y=p=>H-(p-mn)/r*H;
return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:90px"><line x1=0 x2=${W} y1=${y(0)} y2=${y(0)} stroke="#999" stroke-dasharray="4"/><polyline fill=none stroke="#2c7a4b" stroke-width=3 points="${v.map((p,i)=>(i/(v.length-1)*W)+','+y(p)).join(' ')}"/></svg><small>${tr('cap')}</small>`}
function bil(l){const c=calc(l);if(!c.D.length)return`<div class=c>${tr('need')}</div>`;
const s=st(c.pr),dd=l.pk-c.seuilKg,k=(a,b)=>`<div class=k>${a}<b>${b}</b></div>`;
return`<div class="np c"><button class=btn onclick="pe('rapport','Bilan')">${tr('print')}</button><button class="btn b2" style="margin-top:8px" onclick="exp(${l.id})">${tr('exp')}</button></div>
<div id=rapport class=c><div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--g);padding-bottom:6px"><div><b style="color:var(--g);font:700 22px Georgia,serif"><img src="${LG}" class=lgo>T.A.S</b><div style="font-size:12px;color:#555">Trafo AgroSystème</div></div><span>${tr('bilAu')} ${dt(c.last.d)}</span></div>
<h3>${ES[l.esp]} ${esc(l.name)} (${sp(l.esp)})</h3><div style="font-size:13px">${tr('deb')} : ${dt(l.start)} · ${tr('n0').replace(/ \(.*\)/,'')} : ${l.n0} · ${tr('viv')} : ${c.v} · ${tr('mort')} : ${f(c.mp)} %</div>
<div class="v ${s[0]}" style="margin:10px 0">${s[1]} : ${m(c.pr)}</div>
<div class=g2>${k(tr('rec')+' ('+f(c.tw)+' kg × '+f(l.pk)+')',m(c.rev))}${k(tr('cost'),m(c.cost))}${k(tr('achat'),m(l.n0*l.cu))}${k(tr('ali')+' ('+f(c.al)+' kg)',m(c.ac))}${k(tr('au'),m(c.au))}${k(tr('poidsA'),f(c.w)+' kg')}${k(tr('ic'),f(c.ic))}${k(tr('bio')+' ('+c.v+' × '+f(c.w)+' kg)',f(c.tw)+' kg')}</div>
<div class=c style="border:2px dashed var(--am)"><b>${tr('seuilT')}</b><div>${tr('minK')} : <b>${m(c.seuilKg)}</b> · ${tr('minA')} : <b>${m(c.seuil)}</b></div><div>${tr('pEst')} ${m(l.pk)}/kg : ${!isFinite(dd)?tr('nc'):dd>=0?`${tr('marge')} ${m(dd)} (${f(dd/l.pk*100)} %) ${tr('parKg')}`:`${tr('perteV')} ${m(-dd)} ${tr('parKg')}`}</div></div>
${chart(c.ser)}<div style="margin-top:8px">${tbl(c,false,l)}</div>
<p style="font-size:11px;color:#666;margin-top:10px">${tr('foot')} ${new Date().toLocaleDateString('fr-FR')}. ${tr('foot2')}</p></div>`}
function exp(id){const l=S.lots.find(x=>x.id==id),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(l)],{type:'application/json'}));a.download='lot-'+l.name.replace(/\W+/g,'_')+'.json';a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result),a=Array.isArray(p.lots)?p.lots:[p];if(!a.length||a.some(l=>!l.name||!l.days))throw 0;a.forEach((l,k)=>{l.id=Date.now()+k;if(l.pk===undefined)l.pk=0;S.lots.push(l)});save();dr(0);render()}catch(e){alert(tr('inv'))}};r.readAsText(i.files[0])}
function expAll(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({lots:S.lots,cur:S.cur})],{type:'application/json'}));a.download='sauvegarde-TAS-'+today()+'.json';a.click()}
const CT={mail:'t.a.strafo@gmail.com',tel:'+261389305691',telF:'+261 38 93 056 91',fb:'https://www.facebook.com/profile.php?id=61571113712041'};
const sub=s=>encodeURIComponent('T.A.S – '+s);
function dr(o){$('#ov').classList.toggle('on',!!o);if(o)$('#pn').innerHTML=drawer()}
function drawer(){const b=(h,t,s,x='')=>`<a class="btn b2 ln" href="${h}" ${x}>${t}<small>${s}</small></a>`;
return`<div style="display:flex;justify-content:space-between;align-items:center"><b style="font:700 22px Georgia,serif">☰ ${tr('menu')}</b><button class=x onclick="dr(0)" aria-label="X">✕</button></div>
<h3>⚙️ ${tr('set')}</h3><label>${tr('lang')}</label><div class=g2><button class="btn ${S.lang=='mg'?'':'b2'}" onclick="setLang('mg')">🇲🇬 Malagasy</button><button class="btn ${S.lang=='fr'?'':'b2'}" onclick="setLang('fr')">🇫🇷 Français</button></div>
<label>${tr('cur')}</label><input value="${esc(S.cur)}" onchange="S.cur=this.value;save();render()">
<h3>📞 ${tr('ctc')}</h3>${b('mailto:'+CT.mail+'?subject='+sub('Contact'),'✉️ '+tr('cMail'),CT.mail)}${b('tel:'+CT.tel,'📞 '+tr('cCall'),CT.telF)}${b('sms:'+CT.tel,'💬 '+tr('cSms'),CT.telF)}${b(CT.fb,'📘 '+tr('cFb'),'trafo agrosysteme','target=_blank rel=noopener')}
<h3>🧰 ${tr('tools')}</h3>${DP?`<button class="btn" style="background:var(--am);color:#2b2300" onclick="inst()">${tr('inst')}</button>`:''}<button class="btn b2" style="margin-top:8px" onclick="$('#imp').click()">${tr('imp')}</button><input id=imp type=file accept=".json" hidden onchange="imp(this)"><button class="btn b2" style="margin-top:8px" onclick="expAll()">${tr('bk')}</button>
<h3>📝 ${tr('rem')}</h3>${b('mailto:'+CT.mail+'?subject='+sub(tr('remS')),'✉️ '+tr('remB'),CT.mail)}
<p style="font-size:12px;color:#666;margin-top:16px">T.A.S – Trafo AgroSystème · v1.2</p>`}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
